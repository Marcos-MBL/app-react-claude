<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>buscador-peliculas</title>
    <script>
      // Aplica el tema guardado antes del primer render para evitar un parpadeo visual.
      (function () {
        var stored = localStorage.getItem('theme')
        var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Carga sql.js como global `window.initSqlJs`: el paquete npm está empaquetado
         como UMD/emscripten y Vite no lo interopera bien como import ESM. -->
    <script src="https://sql.js.org/dist/sql-wasm.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
